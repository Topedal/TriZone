credits:
         # http://docs.missionpinball.org/en/latest/game_logic/credits/index.html
         #   this copied from C:\Users\David\AppData\Local\Programs\Python\Python36-32\Lib\site-packages\mpf\modes\credits\config
    max_credits: 12
    free_play: no     # Changing this makes no difference to free_play / credit.  
                      # Disable the credit mode in modes: section above to enable free play
    #service_credits_switch: s_esc
    switches:
        - switch: s_l_coin
          type: money
          value: .25
        - switch: s_c_coin
          type: money
          value: .50
        - switch: s_r_coin
          type: token
          value: 1
    pricing_tiers:
        - price: .50
          credits: 1
        - price: 2
          credits: 5
    fractional_credit_expiration_time: 15m
    credit_expiration_time: 2h
    persist_credits_while_off_time: 1h
    free_play_string: Free Play
    credits_string: Credits
    events:
        - event: TRIscoreSpec
          type: TRIspec
          credits: 1
        - event: has_match
          type: match
          credits: 1
        - event: ZONEscoreSpec
          type: ZONEspec
          credits: 1
        - event: high_score_award_display
          type: HSspec
          credits: 3
   
game:
  balls_per_game: 1
  max_players: 4
  
