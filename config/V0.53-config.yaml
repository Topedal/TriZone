player_vars:
               # initail setup values
    bonus:
        initial_value: 0     
    bonus_multiplier:
        initial_value: 1     # this on game start, multipler carries over on ball drain if <=4
    TRIprog:
        initial_value: 2     # prob need a settings mode to sort this
    ZONEprog:
        initial_value: 0
       
    hold_bm:                     #trying to trap carryover hold bonus multipler
