coils:
    c_ball_rel:
        number:
    c_eject:
        number:
    c_Z:
        number:
    c_O:
        number:
    c_N:
        number:
    c_E:
        number:
    c_knock:
        number:
    c_t_pop:
        number:
    c_l_pop:
        number:
    c_r_pop:
        number:
    c_l_sling:
        number:
        default_pulse_ms: 5000
    c_r_sling:
        number:
    c_l_flip:     # use eos or seperate coils?
        number:
        default_hold_power: 0.5    # not sure if needed with eos
    c_r_flip:
        number: 
        default_hold_power: 0.5
    
drop_targets:
     Zdrop:
        switch: s_Z_drop
        reset_coil: c_Z
     Odrop:
        switch: s_O_drop
        reset_coil: c_O
     Ndrop:
        switch: s_N_drop
        reset_coil: c_N
     Edrop:
        switch: s_E_drop
        reset_coil: c_E
        
drop_target_banks:
                       # not a bank as such, but easy reset when all down
    ZONE_drops:
        drop_targets: Zdrop, Odrop, Ndrop, Edrop
        reset_coils: c_Z, c_O, c_N, c_E
        reset_on_complete: 1s
        reset_events: #H_ro_hit , I_ro_hit  # this fot tyesying, not in game play
        
ball_devices:
    bd_drain:
        ball_switches: s_outhole
        eject_coil: c_ball_rel
        ##eject_targets: bd_plunger_lane
        #>>eject_targets: bd_plunger
        eject_targets: playfield           #no plunger lane sw
        tags: drain, home, trough
        debug: true
        
    bd_eject_hole:
        ball_switches: s_eject
        eject_coil: c_eject
        #eject_timeout: 2s   
        
autofire_coils:
    af_l_sling:
        coil: c_l_sling
        switch: s_l_sling
    af_r_sling:
        coil: c_r_sling 
        switch: s_r_sling
    af_t_pop:
        coil: c_t_pop
        switch: s_t_pop
    af_l_pop:
        coil: c_l_pop
        switch: s_l_pop
    af_r_pop:
        coil: c_r_pop
        switch: s_r_pop
        
playfields:
    playfield:
        #default_source_device: bd_plunger
        default_source_device: bd_drain
        tags: default
        
flippers:
    f_l_flip:
        main_coil: c_l_flip
        # # hold_coil: c_flipper_left_hold   # use eos?
        activation_switch: s_l_flip
    f_r_flip:
        main_coil: c_r_flip
        # # hold_coil: c_flipper_right_hold
        activation_switch: s_r_flip
        
virtual_platform_start_active_switches:
    s_outhole                   #puts a ball in the outhole
    
info_lights:
