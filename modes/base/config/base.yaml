#config_version=5

##! mode: base

# Tri Zone base  
#    TRI is retained over ball drain
#    Zone resets on ball drain`
#    Multiplier hold over ball drain id mult <=4, resets if ==5

mode:
    start_events: ball_starting
    #stop_events: ball_drain
    priority: 120
    
config:
     - light_player.yaml    # this goes in ..\mode\base

variable_player:
    sw_A:
        score: 1000
    sw_B: 
        score: 1000
    sw_tenpt:
        score: 10
    sw_twentypt:
        score: 20
    sw_fiftypt:
        score: 50
    sw_out:
        score: 500
    sw_tri:
        score: 1000       
    sw_bonus:
        bonus: 1 
    sw_outlane:
        score: 500    
        
    player_bonus{current_player.bonus>19}:    # limit bonus count
        bonus:
            int: 19
            action: set
    player_bonus_multiplier{current_player.bonus_multiplier>5}:
        bonus_multiplier:
            int: 5
            action: set    
    player_TRIprog{current_player.TRIprog>5}:
        TRIprog:
            int: 1
            action: set   
    player_ZONEprog{current_player.ZONEprog>4}:
        ZONEprog:
            int: 4
            action: set 
            
            
#variable_player:              #want to set machine_last_match_no = winner_number
    mode_match_stopping:
        machine_last_match_no:
            int: 15  #winner_number
            action: set
   
