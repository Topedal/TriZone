light_player:                # this for how WMS player lights work, 
  player_added.1{num==1}:      # only the highest number of the coined up players is on
    l_1cplay: on
    l_2cplay: off
    l_3cplay: off
    l_4cplay: off
  player_added.2{num==2}:
    l_1cplay: off
    l_2cplay: on
    l_3cplay: off
    l_4cplay: off
  player_added.3{num==3}:
    l_1cplay: off
    l_2cplay: off
    l_3cplay: on
    l_4cplay: off
  player_added.4{num==4}:
    l_1cplay: off
    l_2cplay: off
    l_3cplay: off
    l_4cplay: on
 # credits_added{machine.credits_whole_num >=1}:    # event c no keyword, but use vars
  "{machine.credits_whole_num >=1}":                #subscribed config player  http://docs.missionpinball.org/en/latest/events/overview/conditional.html?highlight=conditional%20event
    l_credits_apron: on
  # "{machine_var_credits_value >=1}":                #subscribed config player  http://docs.missionpinball.org/en/latest/events/overview/conditional.html?highlight=conditional%20event
    # l_credits_apron: on
    
    
