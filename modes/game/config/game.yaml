slides:
  base_slide: []

slide_player:
  single_player_ball_started: base_slide
  #T_hit: HowTo
  

widgets:
  base_score_widget:
    - type: text
      text: Player (number),  (score)
      #style: score_style_singleplayer
  # base_level_widget:
    # - type: text
      # text: LVL (player|level)
      # style: mp_player_3
  base_ball_widget:
    - type: text
      text: BALLx (ball)
      anchor_y: bottom
          #style: small
      y: bottom+1
      #style: mp_player_4
  cr_info_widget:
    - type: text
      text:  (machine|credits_string)
      y: bottom
      x: 700
      anchor_x: right
      anchor_y: bottom

widget_player:
  # First event, before additional players have a chance to enter
  game_started:
    base_score_widget:
      slide: base_slide
    # base_level_widget:
      # slide: base_slide
    base_ball_widget:
      slide: base_slide
    cr_info_widget:
      slide: base_slide