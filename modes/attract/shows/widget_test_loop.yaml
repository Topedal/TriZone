- time: 0
#- duration: 5s
  slides:
    awesome_slide: #[]
      widgets:
      - type: text
        text: Widget loop test
        font_size: 50
      transition:
        type: push
        duration: 2s
        direction: left
   #   expire: 3s
   
# - duration: 5s
  # slides:
    # HowTo: 
    # expire: 4s


- time: '+2'
#- duration: 3s
  slides:
    press_start:
      widgets:
      - type: Text
        text: PRESS STARTx
        animations:
          pre_show_slide:
            - property: opacity
              value: 0
              duration: .5s
            - property: opacity
              value: 1
              duration: .5s
              repeat: false
      - type: Text
        text: FREE PLAY
        color: green
        y: 10
        anchor_y: bottom
      transition:
         type: move_in
         duration: 1s
         direction: right

- duration: 6s 
  slides:        
    HowTo:
        widgets:
            - type: image
              #image: Sepia4
              image: BWplayfield5
              x: 799
              anchor_x: right
            - type: text
              text: How to Play
              font_size: 60
              color: red
              bold: true
              x: 232 #400
              y: 515
              anchor_x: center
              anchor_y: bottom
            - type: text
              text: A B - bonus multiplier
              font_size: 40
              color: green
              bold: false
              x: 30
              y: 425
              anchor_x: left
              anchor_y: bottom
            - type: text
              text: T R I - scores lit value
              font_size: 40
              color: blue
              bold: false
              x: 30
              y: 350
              anchor_x: left
              anchor_y: bottom
            - type: text
              text: Z O N E - lites 1 to 4
              font_size: 40
              color: yellow
              bold: false
              x: 30
              y: 275
              anchor_x: left
              anchor_y: bottom
            - type: text
              text: 1 - lites spinner
              font_size: 25
              color: purple
              bold: false
              x: 50
              y: 220
              anchor_x: left
              anchor_y: bottom  
            - type: text
              text: 2 - lites eject
              font_size: 25
              color: white
              bold: false
              x: 50
              y: 180
              anchor_x: left
              anchor_y: bottom
            - type: text
              text: 3 - lites drops
              font_size: 25
              color: orange
              bold: false
              x: 50
              y: 140
              anchor_x: left
              anchor_y: bottom                
            - type: text
              text: 4 - lites outlanes for special
              font_size: 25
              color: pink
              bold: false
              x: 50
              y: 100
              anchor_x: left
              anchor_y: bottom                
              

