#show_version=5
##! show: attract_display_loop

- duration: 3s
  slides:
    awesome_slide:
      widgets:
      - type: text
        text: WMS Tri Zone
        font_size: 50
      transition:
         type: push
         duration: 2s
         direction: left

- duration: 3s
  slides:
    press_start:
      widgets:
      - type: Text
        text: PRESS START
        font_size: 50
        animations:
          pre_show_slide:
            - property: opacity
              value: 0
              duration: .5s
            - property: opacity
              value: 1
              duration: .5s
              repeat: true
      # - type: Text
        # text: FREE PLAY - this si fixed
        # color: green
        # y: 10
        # anchor_y: bottom
      - type: text
        text: "(machine|credits_string)"
        y: 100
  
      transition:
         type: move_in
         duration: 1s
         direction: right

- duration: 5
  slides:
    mission_pinball:
      widgets:
      - type: Text
        text: Mission Pinball Framework
        color: red
        font_size: 60
        bold: true
        y: 400
      - type: text
        text: and
        color: c0c0c0
        font_size: 20
        y: 300
      - type: text
        text: Open Pinball Project
        color: yellow
        font_size: 60
        bold: true
        y: 200
      transition:
         type: move_in
         duration: 1s
         direction: top
         
- duration: 3
  slides:
    card_slide:
      widgets:
      - type: image
        image: Splash
        #scale: 0.6
      
- duration: 6s 
  slides:        
    HowTo:
        widgets:
            - type: image
              #image: Sepia4
              image: BWplayfield5
              x: 799
              anchor_x: right
            - type: text
              text: How to Play
              font_size: 60
              color: red
              bold: true
              x: 232 #400
              y: 515
              anchor_x: center
              anchor_y: bottom
            - type: text
              text: A B - bonus multiplier
              font_size: 40
              color: green
              bold: false
              x: 30
              y: 425
              anchor_x: left
              anchor_y: bottom
            - type: text
              text: T R I - scores lit value
              font_size: 40
              color: blue
              bold: false
              x: 30
              y: 350
              anchor_x: left
              anchor_y: bottom
            - type: text
              text: Z O N E - lites 1 to 4
              font_size: 40
              color: yellow
              bold: false
              x: 30
              y: 275
              anchor_x: left
              anchor_y: bottom
            - type: text
              text: 1 - lites spinner
              font_size: 25
              color: purple
              bold: false
              x: 50
              y: 220
              anchor_x: left
              anchor_y: bottom  
            - type: text
              text: 2 - lites eject
              font_size: 25
              color: white
              bold: false
              x: 50
              y: 180
              anchor_x: left
              anchor_y: bottom
            - type: text
              text: 3 - lites drops
              font_size: 25
              color: orange
              bold: false
              x: 50
              y: 140
              anchor_x: left
              anchor_y: bottom                
            - type: text
              text: 4 - lites outlanes for special
              font_size: 25
              color: pink
              bold: false
              x: 50
              y: 100
              anchor_x: left
              anchor_y: bottom  
        
- duration: 3
  slides:
    last_game_score_slide1:
      widgets:
      - type: text
        text: LAST GAME
        font_size: 50
        y: 60%
      - type: text
        text: (machine|player1_score)
        x: left+3%
        y: top-3% #100%
        anchor_x: left 
        anchor_y: top        
        number_grouping: true
        min_digits: 2
        font_size: 50
      - type: text
        text: (machine|player2_score)
        x: right-3% #100%
        y: top-3% #100%
        anchor_x: right
        anchor_y: top
        number_grouping: true
        min_digits: 2
        font_size: 50
      - type: text
        text: (machine|player3_score)
        x: left+3%
        y: bottom+3%
        anchor_x: left
        anchor_y: bottom
        number_grouping: true
        min_digits: 2
        font_size: 50
      - type: text
        text: (machine|player4_score)
        x: right-3%
        y: bottom+3%
        anchor_x: right
        anchor_y: bottom
        number_grouping: true
        min_digits: 2
        font_size: 50
        
      - type: text
        text: (machine|credits_string)
        y: bottom
        anchor_y: bottom
