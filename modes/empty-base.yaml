#config_version=5

##! mode: base

# Tri Zone base

mode:
    start_events: ball_starting
    #stop_events: ball_drain
    priority: 120
    
config:
     - light_player.yaml    # this goes in ..\mode\this-mode
                            # copy and change the name to suit too

variable_player:
    sw_A:
        score: 1000
    sw_B: 
        score: 1000
    sw_tenpt:
        score: 10
    sw_twentypt:
        score: 20
    sw_fiftypt:
        score: 50
    sw_out:
        score: 500
    sw_tri:
        score: 1000       
    sw_bonus:
        bonus: 1    
        
 
        


    ball_drain:
        ZONEprog: 
            int: 0
            action: set
        #TRIprog: #0 {if current_player.TRIprog_val==5} else TRIprog
        

    player_bonus{current_player.bonus>19}:    # limit bonus count
        bonus:
            int: 19
            action: set
    player_bonus_multiplier{current_player.bonus_multiplier>5}:
        bonus_multiplier:
            int: 5
            action: set    
    player_TRIprog{current_player.TRIprog>5}:
        TRIprog:
            int: 1
            action: set   
    player_ZONEprog{current_player.ZONEprog>4}:
        TRIprog:
            int: 4
            action: set     
    

        







